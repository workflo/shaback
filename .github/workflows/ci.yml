name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-20.04, ubuntu-22.04]
        include:
          - os: ubuntu-20.04
            cmake_version: "3.16"
          - os: ubuntu-22.04
            cmake_version: "3.22"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          g++ \
          libssl-dev \
          libz-dev \
          liblua5.1-dev \
          libbz2-dev \
          liblzma-dev \
          libgdbm-dev \
          libzstd-dev

    - name: Configure CMake
      working-directory: ${{ github.workspace }}/src
      run: cmake . -DCMAKE_BUILD_TYPE=Release

    - name: Build
      working-directory: ${{ github.workspace }}/src
      run: make -j$(nproc)

    - name: Verify binary
      working-directory: ${{ github.workspace }}/src
      run: |
        ls -lah shaback
        file shaback
        ./shaback --help || true

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: shaback-${{ matrix.os }}
        path: src/shaback
        retention-days: 7

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          g++ \
          libssl-dev \
          libz-dev \
          liblua5.1-dev \
          libbz2-dev \
          liblzma-dev \
          libgdbm-dev \
          libzstd-dev \
          cppcheck

    - name: Run cppcheck
      run: |
        cppcheck --enable=warning,style,performance,portability \
          --suppress=missingIncludeSystem \
          --quiet \
          --error-exitcode=0 \
          src/*.cpp src/lib/*.cpp 2>&1 | tee cppcheck-report.txt

    - name: Upload cppcheck report
      uses: actions/upload-artifact@v4
      with:
        name: cppcheck-report
        path: cppcheck-report.txt
        retention-days: 30

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build, static-analysis]
    if: always()

    steps:
    - name: Check build status
      run: |
        echo "Build job status: ${{ needs.build.result }}"
        echo "Static analysis status: ${{ needs.static-analysis.result }}"

        if [ "${{ needs.build.result }}" != "success" ]; then
          echo "Build failed!"
          exit 1
        fi

        echo "All checks passed!"
